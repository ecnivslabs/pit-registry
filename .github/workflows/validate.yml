name: Validate PR

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install blake3
        run: pip install blake3 --quiet

      # ── 1. Exactly one registry file changed ─────────────────────────────────
      - name: Check single registry file changed
        id: files
        run: |
          BASE="${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD \
            | grep -v -E '^(\.github/|README\.md$|\.gitignore$)')

          COUNT=$(printf '%s\n' "$CHANGED" | grep -c '[^[:space:]]' || true)
          if [[ "$COUNT" -ne 1 ]]; then
            echo "::error::PR must change exactly one registry file (changed: $COUNT)"
            exit 1
          fi

          PKG_FILE="$CHANGED"
          pkg_name=$(basename "$PKG_FILE")
          prefix=$(dirname "$PKG_FILE")
          expected="${pkg_name:0:2}"

          if [[ "$prefix" != "$expected" ]]; then
            echo "::error::File must be at '$expected/$pkg_name', not '$prefix/$pkg_name'"
            exit 1
          fi

          echo "pkg_file=$PKG_FILE" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$pkg_name" >> "$GITHUB_OUTPUT"

      # ── 2. Exactly one new record, zero removed ───────────────────────────────
      # Compares parsed JSON objects rather than raw diff lines. pit publish
      # writes registry files with no trailing newline, so a raw line-diff
      # makes every append look like "remove the old last line (no \n),
      # re-add it (with \n), add the new line" -- 2 additions, not 1. Parsing
      # both sides and diffing the resulting record sets sidesteps the
      # newline question entirely.
      - name: Extract new record
        id: entry
        env:
          PKG_FILE: ${{ steps.files.outputs.pkg_file }}
        run: |
          BASE="${{ github.base_ref }}"

          git show "origin/$BASE:$PKG_FILE" > /tmp/base_file.txt 2>/dev/null || : > /tmp/base_file.txt
          cp "$PKG_FILE" /tmp/head_file.txt

          python3 <<'PYEOF'
          import json, sys

          def load_records(path):
              records = {}
              with open(path) as f:
                  for lineno, line in enumerate(f, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          d = json.loads(line)
                      except json.JSONDecodeError as e:
                          print(f"::error::Invalid JSON on line {lineno} of {path}: {e}")
                          sys.exit(1)
                      records[json.dumps(d, sort_keys=True)] = line
              return records

          base_records = load_records("/tmp/base_file.txt")
          head_records = load_records("/tmp/head_file.txt")

          added = [line for key, line in head_records.items() if key not in base_records]
          removed = [line for key, line in base_records.items() if key not in head_records]

          if len(added) != 1:
              print(f"::error::PR must add exactly 1 JSON record (found: {len(added)})")
              sys.exit(1)
          if len(removed) != 0:
              print(f"::error::PR must not remove or modify existing records (changed: {len(removed)})")
              sys.exit(1)

          with open("/tmp/added_line.txt", "w") as out:
              out.write(added[0])
          PYEOF

          echo "json_line<<__EOF__" >> "$GITHUB_OUTPUT"
          cat /tmp/added_line.txt >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      # ── 3. Schema validation + duplicate version check ────────────────────────
      - name: Validate JSON schema
        id: schema
        env:
          JSON_LINE: ${{ steps.entry.outputs.json_line }}
          PKG_FILE:  ${{ steps.files.outputs.pkg_file }}
          PKG_NAME:  ${{ steps.files.outputs.pkg_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          line     = os.environ["JSON_LINE"].strip()
          pkg_file = os.environ["PKG_FILE"]
          pkg_name = os.environ["PKG_NAME"]

          try:
              d = json.loads(line)
          except json.JSONDecodeError as e:
              print(f"::error::Invalid JSON: {e}")
              sys.exit(1)

          errors = []
          for field in ("name", "vers", "cksum", "dl"):
              if not d.get(field):
                  errors.append(f"missing required field '{field}'")

          if d.get("name") and d["name"] != pkg_name:
              errors.append(f"name '{d['name']}' must match filename '{pkg_name}'")

          if not isinstance(d.get("deps", []), list):
              errors.append("'deps' must be an array")

          if d.get("dl") and not d["dl"].startswith("https://"):
              errors.append("dl must use https")

          # Check for duplicate version against the pre-PR file. Must use the
          # base snapshot, not pkg_file (HEAD) -- HEAD already contains the
          # new record, so comparing against it always matches itself.
          if os.path.isfile("/tmp/base_file.txt"):
              new_vers = d.get("vers", "")
              with open("/tmp/base_file.txt") as f:
                  for lineno, existing in enumerate(f, 1):
                      existing = existing.strip()
                      if not existing:
                          continue
                      try:
                          ed = json.loads(existing)
                          if ed.get("vers") == new_vers:
                              errors.append(f"version '{new_vers}' already exists (line {lineno})")
                      except json.JSONDecodeError:
                          pass  # pre-existing bad line; not our problem here

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"Schema OK: {pkg_name}@{d['vers']}")
          PYEOF

          # Re-parse to expose outputs for later steps
          CKSUM=$(python3 -c "import json,os; d=json.loads(os.environ['JSON_LINE']); print(d['cksum'])")
          DL=$(python3    -c "import json,os; d=json.loads(os.environ['JSON_LINE']); print(d['dl'])")
          VERS=$(python3  -c "import json,os; d=json.loads(os.environ['JSON_LINE']); print(d['vers'])")

          echo "cksum=$CKSUM" >> "$GITHUB_OUTPUT"
          echo "dl=$DL"       >> "$GITHUB_OUTPUT"
          echo "vers=$VERS"   >> "$GITHUB_OUTPUT"

      # ── 4. Download archive and verify BLAKE3 checksum ────────────────────────
      - name: Verify BLAKE3 checksum
        env:
          DL_URL:          ${{ steps.schema.outputs.dl }}
          EXPECTED_CKSUM:  ${{ steps.schema.outputs.cksum }}
        run: |
          echo "Downloading: $DL_URL"
          curl -fsSL --max-time 120 "$DL_URL" -o archive.pit.zst

          ACTUAL=$(python3 - <<'PYEOF'
          import blake3, sys
          h = blake3.blake3()
          with open("archive.pit.zst", "rb") as f:
              while True:
                  chunk = f.read(65536)
                  if not chunk:
                      break
                  h.update(chunk)
          print(h.hexdigest())
          PYEOF
          )

          echo "Expected: $EXPECTED_CKSUM"
          echo "Actual:   $ACTUAL"

          rm -f archive.pit.zst

          if [[ "$ACTUAL" != "$EXPECTED_CKSUM" ]]; then
            echo "::error::BLAKE3 mismatch  -  archive tampered or wrong file"
            exit 1
          fi

          echo "Checksum verified."

      # ── 5. Ownership check ────────────────────────────────────────────────────
      - name: Ownership check
        id: ownership
        env:
          PKG_FILE:   ${{ steps.files.outputs.pkg_file }}
          PR_AUTHOR:  ${{ github.event.pull_request.user.login }}
        run: |
          BASE="${{ github.base_ref }}"

          if git show "origin/$BASE:$PKG_FILE" &>/dev/null; then
            # Existing package: find who first published it via the oldest commit
            FIRST_COMMIT=$(git log --format="%H" "origin/$BASE" -- "$PKG_FILE" | tail -1)

            if [[ -z "$FIRST_COMMIT" ]]; then
              echo "::error::Cannot determine original commit for $PKG_FILE"
              exit 1
            fi

            # Resolve the PR that introduced that commit
            ORIGINAL_AUTHOR=$(gh api \
              "repos/${{ github.repository }}/commits/$FIRST_COMMIT/pulls" \
              --jq '.[0].user.login' 2>/dev/null || true)

            if [[ -z "$ORIGINAL_AUTHOR" || "$ORIGINAL_AUTHOR" == "null" ]]; then
              echo "::warning::Could not resolve original PR author via API; falling back to git committer"
              ORIGINAL_AUTHOR=$(git log --format="%ae" "$FIRST_COMMIT" -1 | cut -d@ -f1)
            fi

            echo "Original author: $ORIGINAL_AUTHOR"
            echo "PR author:       $PR_AUTHOR"

            if [[ "$PR_AUTHOR" != "$ORIGINAL_AUTHOR" ]]; then
              echo "::error::Package '$PKG_FILE' is owned by '$ORIGINAL_AUTHOR'. PR opened by '$PR_AUTHOR'  -  rejected."
              exit 1
            fi

            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New package  -  flagging for manual review."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. Hand off to the trusted merge workflow ─────────────────────────────
      # This job runs on `pull_request` from a fork with a read-only token by
      # design (GitHub forces that on fork PRs regardless of the `permissions:`
      # block above), so it cannot label, comment, or merge. It writes its
      # verdict to an artifact; merge.yml (triggered by `workflow_run`, running
      # in base-repo context with a write token, never checking out fork code)
      # reads it and acts.
      - name: Write result artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          PKG_NAME:  ${{ steps.files.outputs.pkg_name }}
          VERS:      ${{ steps.schema.outputs.vers }}
          IS_NEW:    ${{ steps.ownership.outputs.is_new }}
        run: |
          mkdir -p /tmp/result
          cat > /tmp/result/result.json <<EOF
          {
            "pr_number": ${PR_NUMBER},
            "head_sha": "${HEAD_SHA}",
            "pkg_name": "${PKG_NAME}",
            "vers": "${VERS}",
            "is_new": "${IS_NEW}"
          }
          EOF

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: validate-result
          path: /tmp/result/result.json
          retention-days: 1
