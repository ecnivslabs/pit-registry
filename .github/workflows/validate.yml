name: Validate PR

on:
  pull_request_target:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry-publishing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum dependency
        run: python3 -m pip install blake3==1.0.8

      - name: Validate and process publishing PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIT_OWNERSHIP_TOKEN: ${{ secrets.PIT_OWNERSHIP_TOKEN }}
        run: python3 .github/scripts/check_pr.py
